# xfsr per-game profiles (example / shipped defaults)
#
# Install copy:  ~/.config/xfsr/profiles.conf
# Lookup order: SteamAppId → SteamGameId → exe basename → exe_contains
# First matching section wins. Explicit CLI flags always override the profile.
#
# Section headers:
#   [app:730]           Steam AppID
#   [exe:cs2]           basename of argv0 / %command% (lowercase)
#   [contains:iw3sp]    substring match on the command line
#
# Keys (all optional):
#   preset=quality|balanced|performance|ultra
#   fsr=1|0|blit|native     (0/blit = linear upscale; native = passthrough)
#   upscaler=fsr1|blit|nis|edge  (edge = heavier; used by --hybrid)
#   rcas=0|1
#   edge_mode=quality|perf  (EdgePass; perf = lite path)
#   edge_sharpness=0..1     (EdgePass post-scale sharpen)
#   offload=0|1
#   hybrid=0|1              implies offload+one-way+edge (xfsr-run --hybrid)
#   one_way=0|1|force
#   caps_shrink=0|1
#   overlay=0|1
#   zink=0|1|auto
#   wow64=1                 (log hint: set PROTON_USE_WOW64=1)
#   adaptive=0|1            continuous adaptive scale (XFSR_ADAPTIVE)
#   target_fps=60           adaptive target
#   gamescope=0|1           nest in gamescope (nested=preset render → output)
#   gamescope_fs=0|1        gamescope host fullscreen (-f); game still at nest size
#   gamescope_filter=fsr|nis|linear|nearest|sgsr
#   note=...                (printed at launch)
#
# Peak FPS when the layer engages: same-GPU + blit|nis|edge + ultra.
# Titles that ignore caps shrink (CS2, Village, many DXVK): use gamescope=1
# (xfsr-run --any). On NVIDIA the wrapper picks --backend sdl automatically.

# Counter-Strike 2 — nest (layer stays identity)
[app:730]
preset=ultra
upscaler=fsr1
rcas=0
offload=0
gamescope=1
caps_shrink=0
overlay=1
note=CS2: xfsr-run --any (gamescope nest); or Steam: xfsr-run --any --preset ultra %command%

# Call of Duty 4: Modern Warfare (2007) — nest ≥640×480 + host fullscreen + Wow64
[app:7940]
preset=performance
upscaler=fsr1
rcas=0
offload=0
gamescope=1
gamescope_fs=1
overlay=1
wow64=1
note=CoD4: XFSR_GAMESCOPE_FORCE=1 xfsr-run --any --gamescope-fs --preset performance %command%

[contains:iw3sp]
preset=performance
upscaler=fsr1
rcas=0
gamescope=1
gamescope_fs=1
overlay=1
wow64=1

# Resident Evil Village — no gamescope on NVIDIA (black). Layer + blit.
[app:1196590]
preset=quality
upscaler=blit
rcas=0
offload=0
gamescope=0
caps_shrink=1
overlay=0
note=Village: xfsr-run --preset quality --upscaler blit --no-rcas --no-overlay %command%

# Uncapped Vulkan / GL benches (this repo)
[exe:xfsr_load_vk]
preset=ultra
upscaler=blit
rcas=0
offload=0
overlay=1
adaptive=1
target_fps=60

[exe:xfsr_load_gl]
preset=ultra
upscaler=blit
rcas=0
offload=0
zink=1
overlay=1
